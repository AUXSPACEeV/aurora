#
# SWD on J5: pin 2 = SWDCLK, pin 4 = SWDIO, pins 5/6 = GND.
#
# Defaults to a CMSIS-DAP probe, which covers both an ST-Link running the
# DAP firmware and a Raspberry Pi Pico flashed with debugprobe. For a
# classic ST-Link V2 instead, swap the first line for:
#
#   source [find interface/stlink.cfg]
#
source [find interface/cmsis-dap.cfg]

transport select swd

source [find target/stm32wlx.cfg]

# J5 breaks out SWD only - /RESET is on SW2, not on the header - so there
# is no srst line for OpenOCD to drive.
reset_config none separate
