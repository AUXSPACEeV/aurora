#
# Post-mortem core dump persisted to the on-board "coredump" flash
# partition, then read back over the shell after the board comes up again:
#
#   uart:~$ coredump find     # is a dump stored, and is it valid?
#   uart:~$ coredump print    # emit the "#CD:" hex stream
#   uart:~$ coredump erase    # invalidate it before the next run
#
# Decode off-target against the matching ELF:
#   zephyr/scripts/coredump/coredump_serial_log_parse.py <captured> out.bin
#   zephyr/scripts/coredump/coredump_gdbserver.py build/zephyr/zephyr.elf out.bin
#
# Stack with the debug overlay for symbols + a text backtrace:
#   west build -b micrometer/esp32s3/procpu@2 aurora/flight_computer \
#       -- -DEXTRA_CONF_FILE="debug.conf;coredump.conf"
#
# Why flash and not BACKEND_LOGGING: on micrometer@2 the console is the
# ESP32-S3 USB-Serial-JTAG, whose poll_out (serial_esp32_usb.c) silently
# DISCARDS characters once the 64-byte TX FIFO stays full for 50 ms. A
# coredump is the largest burst the firmware ever emits and it is written
# in panic mode, so streaming it over that console loses most of it with no
# "dropped" marker. Flash survives the fault, the reboot, and a power
# cycle; the shell read-back afterwards is interrupt-driven and properly
# back-pressured, so it does not drop.

CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y

# Read the stored dump back out on the next boot.
CONFIG_DEBUG_COREDUMP_SHELL=y

# Registers + the faulting thread's stack only: enough to reconstruct the
# backtrace of a NULL-deref crash. Switch to
# CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y if you need every thread's
# stack -- but see the size budget below first, it will not fit.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Size budget. The coredump partition inherited from
# espressif/partitions_0x0_amp_4M.dtsi is 4 KiB at 0x3ff000; the backend's
# 16-byte header (write-block-size is 4, so no erase-block padding) leaves
# 4080 bytes for data. The stack-top limits default to -1 == "dump to the
# end of the stack region", which for a 4 KiB thread stack overruns the
# partition and truncates the dump. Bound them so the whole thing fits:
#
#   coredump hdr ~12 + Xtensa arch block ~200 + k_thread ~350
#   + block headers ~30 + 2048 stack  ==  ~2.6 KiB of 4080.
#
# 2 KiB of stack top is generous on Xtensa, where register-window spills
# make frames large.
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP=y
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT_FOR_CURRENT=2048
CONFIG_DEBUG_COREDUMP_THREAD_STACK_TOP_LIMIT=1024

# Take the SD card off the panic path. The FS log backend flushes
# synchronously during a panic; a real crash then looks like a freeze.
# Console/UART still gets everything. Disabling it here also doubles as the
# test for whether the SD/FATFS is itself the freeze source.
# if the freezes stop with this off, the card/filesystem is the culprit.
CONFIG_LOG_BACKEND_FS=n
