CONFIG_ZTEST=y
CONFIG_AURORA_STATE_MACHINE=y
CONFIG_AURORA_STATE_MACHINE_CONFIG_STORE=y

# Threshold store on the qemu_x86 sim-flash (see boards/qemu_x86.overlay).
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_STATS=n
# The corruption test overwrites part of an already-written record instead
# of erasing first, which the simulator otherwise rejects as a double write.
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y

# Non-default thresholds, so the tests can tell the factory defaults apart
# from a stored set.
CONFIG_BOOST_ALTITUDE=77
CONFIG_MAIN_DESCENT_HEIGHT=333
