CONFIG_LOG=y

# Console and shell land on the J5 debug header (USART1 on AUX-Tel); the
# stack UART stays reserved for telemetry frames.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# The stack-link receiver drains the UART from its interrupt.
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_GPIO=y
CONFIG_CRC=y

# Sub-GHz radio
CONFIG_LORA=y

# Bring-up shell: "abby status" and "abby test".
CONFIG_SHELL=y
CONFIG_ABBY_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_MAIN_STACK_SIZE=1024
