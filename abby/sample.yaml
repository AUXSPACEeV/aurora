#
# Lets Twister build the application in CI. abby has no automated runtime
# test yet.
sample:
  description: AUX-Tel telemetry bridge between the stack and LoRa
  name: abby
common:
  build_only: true
  sysbuild: true
  platform_allow:
    - tel65@1
  integration_platforms:
    - tel65@1
tests:
  abby.default: {}
  abby.debug:
    extra_overlay_confs:
      - debug.conf
  abby.receive:
    extra_overlay_confs:
      - receive.conf
  abby.receive_debug:
    extra_overlay_confs:
      - receive.conf
      - debug.conf
