#
# Ground-side role: LoRa in, stack UART out.
#   west build -b tel65@1 abby -- -DEXTRA_CONF_FILE=receive.conf
#
# Everything about the radio stays at the application defaults, so a
# board built this way and one built without it are two ends of the same
# link by construction. Change a radio setting and both ends have to be
# rebuilt.

CONFIG_ABBY_ROLE_RECEIVE=y
