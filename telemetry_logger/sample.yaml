#
# Lets Twister build the application in CI. Build checks only: proving the
# recorder end to end needs an abby receiver and an SD card.
sample:
  description: AUX-Core recorder for telemetry frames from an abby receiver
  name: telemetry_logger
common:
  build_only: true
  platform_allow:
    - core65@1/esp32s3/procpu
  integration_platforms:
    - core65@1/esp32s3/procpu
tests:
  app.default.sysbuild:
    sysbuild: true
  app.debug.sysbuild:
    sysbuild: true
    extra_overlay_confs:
      - debug.conf
  app.no_csv:
    extra_configs:
      - CONFIG_TELEMETRY_LOGGER_CSV=n
  app.no_shell:
    extra_configs:
      - CONFIG_SHELL=n
      - CONFIG_TELEMETRY_LOGGER_SHELL=n
      - CONFIG_FILE_SYSTEM_SHELL=n
