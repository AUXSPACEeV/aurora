CONFIG_BOOT_BANNER_STRING="Booting AURORA"

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_CONSOLE=y
CONFIG_SERIAL=y

# The stack-link receiver drains the UART from its interrupt.
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_CRC=y

CONFIG_FILE_SYSTEM=y

# Bring-up shell: "tlog status", "tlog test", and "fs" to pull recordings
# off the card without removing it.
CONFIG_SHELL=y
CONFIG_TELEMETRY_LOGGER_SHELL=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
