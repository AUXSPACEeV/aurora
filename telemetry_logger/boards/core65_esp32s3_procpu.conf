CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_GPIO=y
CONFIG_UART_CONSOLE=y

# SD card (native SDHC, FAT)
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="MMC"
CONFIG_HEAP_MEM_POOL_SIZE=16384

# SD activity LED.
# Only the notify core and the disk LED:
# the buzzer and PWM LED backends signal flight states and need the state machine.
CONFIG_AURORA_NOTIFY=y
CONFIG_AURORA_NOTIFY_DISK_LED=y

# Stacks
CONFIG_ISR_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
