# This is a Kconfig fragment which can be used to enable debug-related options
# in the application. See the README for more details.

# kernel
CONFIG_DEBUG=y
CONFIG_DEBUG_THREAD_INFO=y

# Fatal-error handling.
#
# Zephyr's default with RESET_ON_FATAL_ERROR=n is arch_system_halt(): the
# board stops dead where it faulted. On micrometer@2 that is
# indistinguishable from a brownout or a flat pack, because the halt takes
# the console with it and the panic banner is lost in the USB-Serial-JTAG
# FIFO (see coredump.conf). Rebooting instead means the board comes back,
# re-prints the boot banner -- which is itself the proof that this was a
# fault and not a power loss -- and can be asked for the stored coredump.
#
# Debug-only on purpose: a flight build should not silently reboot a live
# state machine, so this stays out of prj.conf.
CONFIG_RESET_ON_FATAL_ERROR=y

# Reset-cause reporting. hwinfo_esp32 distinguishes POR / PIN / SOFTWARE /
# WATCHDOG / CPU_LOCKUP / BROWNOUT / LOW_POWER_WAKE, which is the one thing
# the console genuinely cannot tell you: whether the board panicked, was
# reset by the watchdog, browned out, or just lost power. main() logs and
# clears it at boot.
CONFIG_HWINFO=y

# Stack-overflow sanitisers
CONFIG_HW_STACK_PROTECTION=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_USAGE=y
CONFIG_EXCEPTION_STACK_TRACE=y

# compiler
CONFIG_SYMTAB=y
CONFIG_SYMTAB_SHELL=y
CONFIG_DEBUG_OPTIMIZATIONS=y
# Keep file:line (that is what names a panic) but drop the condition
# expression, which is the long half of every assert string. Assert strings
# land in DRAM rodata on esp32s3, and DRAM is the binding constraint here.
CONFIG_ASSERT_NO_COND_INFO=y

# Paying for CONFIG_ASSERT: its strings cost ~20 KB of DRAM, which does not
# fit on micrometer@2 at the production buffer sizes. Buy it back from the
# post-flight conversion staging buffers -- they only set how often
# data_logger_convert() calls fs_write(), so the cost is more/smaller SD
# writes after landing and nothing at flight time.
#
# These belong here rather than in the board .conf: EXTRA_CONF_FILE is merged
# after the board fragment, so they override it for debug builds only and the
# production image keeps the full 16 KiB buffers.
CONFIG_DATA_LOGGER_CSV_BUF_SIZE=8192

# thread analyzing
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
CONFIG_THREAD_ANALYZER_USE_LOG=y

# logging
CONFIG_LOG=y

CONFIG_FS_LOG_LEVEL_DBG=y
CONFIG_PYRO_LOG_LEVEL_DBG=y
CONFIG_AURORA_SENSORS_LOG_LEVEL_DBG=y
CONFIG_AURORA_FILTER_LOG_LEVEL_DBG=y
CONFIG_DATA_LOGGER_LOG_LEVEL_DBG=y
CONFIG_STATE_MACHINE_LOG_LEVEL_DBG=y
CONFIG_AURORA_NOTIFY_LOG_LEVEL_DBG=y
CONFIG_AURORA_PWM_MELODY_LOG_LEVEL_DBG=y
CONFIG_AURORA_POWERFAIL_LOG_LEVEL_DBG=y
CONFIG_SENSOR_BOARD_LOG_LEVEL_DBG=y
CONFIG_AURORA_TELEMETRY_LOG_LEVEL_DBG=y
CONFIG_AURORA_PAD_LINK_LOG_LEVEL_DBG=y

# powerfail
CONFIG_AURORA_POWERFAIL_SHUTDOWN=n

# Extra Shells for Debugging
CONFIG_ADC_SHELL=y
CONFIG_AURORA_STATE_MACHINE_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_PYRO_SHELL=y
