CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_GPIO=y
CONFIG_PYRO=y
CONFIG_AURORA_SENSORS=y
CONFIG_IMU=y
CONFIG_IMU_FREQUENCY=100
CONFIG_IMU_UP_AXIS_POS_Y=y
CONFIG_BARO=y
CONFIG_FILTER=y
CONFIG_FILTER_Q_VEL_MILLISCALE=3000
CONFIG_FILTER_R_MILLISCALE=6000
CONFIG_FILTER_APOGEE_DEBOUNCE_SAMPLES=3
CONFIG_ADC=y
CONFIG_CAN=y
CONFIG_UART_CONSOLE=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
# Barometer differs per board revision; its driver Kconfig lives in the
# revision-specific configs (micrometer_esp32s3_procpu_{1,2}.conf).
CONFIG_UART_LINE_CTRL=y
# CONFIG_UDC_DRIVER is not set
# CONFIG_UDC_DWC2 is not set
# CONFIG_USB_DEVICE_STACK is not set
# CONFIG_USB_DEVICE_STACK_NEXT is not set
# CONFIG_COMMON_LIBC_REMOVE is not set
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_SHELL_TEST_COMMANDS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="MMC"
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/MMC:/LOGS"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="LOG."
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=512
CONFIG_LOG_BACKEND_FS_FILE_SIZE=100000000
CONFIG_LOG_BACKEND_FS_AUTOSTART=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=32
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_DATA_LOGGER=y
CONFIG_DATA_LOGGER_DISK_AUTO_MKFS=n
CONFIG_DATA_LOGGER_BIN_BACKEND_FS=y
CONFIG_DATA_LOGGER_CONVERT_INFLUX=n
CONFIG_DATA_LOGGER_CONVERT_CSV=n
CONFIG_DATA_LOGGER_BASE_PATH="/MMC:/DATA"
CONFIG_DATA_LOGGER_SHELL=y
CONFIG_MMC_STACK=y
CONFIG_AURORA_NOTIFY=y
CONFIG_AURORA_NOTIFY_BUZZER=y
CONFIG_AURORA_NOTIFY_LED=y
CONFIG_AURORA_WATCHDOG=y
CONFIG_AURORA_STATE_MACHINE_AUDIT=y
CONFIG_AURORA_STATE_MACHINE_AUDIT_BASE_PATH="/MMC:/STATE"
CONFIG_AURORA_STATE_MACHINE_RBF=y
CONFIG_AURORA_STATE_MACHINE_RETAIN=y

CONFIG_AURORA_PAD_LINK=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Flight of about 50-60 m height with a 6N Motor

# Metrics
CONFIG_BOOST_ACCELERATION=15
CONFIG_BOOST_ALTITUDE=5
CONFIG_BURNOUT_ACCELERATION=10
CONFIG_MAIN_DESCENT_HEIGHT=25
CONFIG_LANDING_VELOCITY=2

# Timers
CONFIG_BOOST_TIMER_MS=200

# Timeouts
CONFIG_APOGEE_TIMEOUT_MS=20000
CONFIG_MAIN_TIMEOUT_MS=2000

# I2C
CONFIG_I2C=y

# Flight thresholds persist in the sm-config flash page (see micrometer_v2.dtsi).
CONFIG_FLASH=y
CONFIG_AURORA_STATE_MACHINE_CONFIG_STORE=y

# Every bmp581 register access goes through the RTIO work queue, so the baro
# poller alone keeps items in flight continuously.
CONFIG_RTIO_WORKQ_POOL_ITEMS=16
CONFIG_RTIO_WORKQ_THREADS_POOL_PRIO=7

# Stacks
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
CONFIG_RTIO_WORKQ_THREADS_POOL_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LSM6DSO_THREAD_STACK_SIZE=4096
CONFIG_DATA_LOGGER_BIN_WRITER_STACK_SIZE=4096
CONFIG_DATA_LOGGER_LOGGER_STACK_SIZE=4096
CONFIG_DATA_LOGGER_CONVERTER_STACK_SIZE=4096
