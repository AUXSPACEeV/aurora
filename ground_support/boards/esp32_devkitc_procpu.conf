# Ground Support config for the ESP32-DevKitC (ESP32-WROOM-32).
# Pairs with the matching .overlay, which puts the IMU + baro on I2C0, GNSS on
# UART1, HC-12 on UART2 and the ST7789 display on SPI3. The console/shell stay
# on UART0 via the on-board USB-UART bridge.

CONFIG_MAIN_STACK_SIZE=4096

# Place the application image at the DT code partition (ESP32 boot flow).
CONFIG_USE_DT_CODE_PARTITION=y

# --- Console (UART0 via USB-UART bridge) -----------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=32

# --- Buses -----------------------------------------------------------
CONFIG_I2C=y
CONFIG_SPI=y

# --- Sensors: BNO08x (9-DoF) + DPS310 baro ---------------------------
CONFIG_SENSOR=y
CONFIG_AURORA_SENSORS=y

CONFIG_IMU=y
CONFIG_IMU_FREQUENCY=50
CONFIG_IMU_MAGNETOMETER=y
# BNO08x sensor-hub over SPI2 (out-of-tree ceva,bno08x driver). The device
# fuses internally and pushes reports on its INT line; the driver latches them
# and serves the sensor API, so the IMU lib polls it (no CONFIG_IMU_TRIGGER).
CONFIG_CEVA_BNO08X=y

CONFIG_BARO=y
CONFIG_BARO_FREQUENCY=50
CONFIG_DPS310=y

# --- GNSS: u-blox NEO-6M over NMEA -----------------------------------
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=y

# --- Display: ST7789V via MIPI-DBI, rendered with LVGL ---------------
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_LVGL=y

CONFIG_IDLE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=4096
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=2048
CONFIG_RTIO_WORKQ_THREADS_POOL_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Disable nested interrupts
CONFIG_XTENSA_INTERRUPT_NONPREEMPTABLE=y

