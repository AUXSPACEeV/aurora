#
# Ground Support config for the Raspberry Pi Pico 2 W (RP2350A, Cortex-M33).
# Pairs with the matching .overlay, which puts the console on USB CDC and wires
# the IMU + baro on I2C0, GNSS on UART0, HC-12 on UART1 and the ST7789 display
# on SPI0.

CONFIG_MAIN_STACK_SIZE=4096

# --- Console / USB CDC -----------------------------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=32

# --- Buses -----------------------------------------------------------
CONFIG_I2C=y
CONFIG_SPI=y

# --- Sensors: MPU-9250 (9-DoF) + DPS310 baro -------------------------
CONFIG_SENSOR=y
CONFIG_AURORA_SENSORS=y

CONFIG_IMU=y
CONFIG_IMU_FREQUENCY=50
CONFIG_IMU_MAGNETOMETER=y
# Polled: no INT line wired. Enable CONFIG_MPU9250_TRIGGER once irq-gpios
# is present in the overlay.
CONFIG_MPU9250=y
CONFIG_MPU9250_MAGN_EN=y
CONFIG_MPU9250_TRIGGER_NONE=y

CONFIG_BARO=y
CONFIG_BARO_FREQUENCY=50
CONFIG_DPS310=y

# --- GNSS: u-blox NEO-6M over NMEA -----------------------------------
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=y

# --- Display: ST7789V via MIPI-DBI, rendered with LVGL ---------------
# NOTE: CONFIG_LVGL requires the lvgl module, which is added to west.yml in
# phase 4; a `west update` must run before this builds.
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_ST7789V=y
CONFIG_LVGL=y
