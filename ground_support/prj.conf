#
# common options, which apply to all boards (will be duplicated in board configs)

# Console and Shell
CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=y

# Boot banner
CONFIG_BOOT_BANNER_STRING="Booting AURORA - Ground Support"

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_TIMESTAMP_USE_REALTIME=y
CONFIG_LOG_SPEED=y
CONFIG_LOG_THREAD_ID_PREFIX=y
CONFIG_LOG_INFO_COLOR_GREEN=y
CONFIG_LOG_DBG_COLOR_BLUE=y
CONFIG_LOG_OUTPUT_FORMAT_TIME_TIMESTAMP=y
# CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE is not set
# CONFIG_LOG_MEM_UTILIZATION is not set
CONFIG_LOG_CMDS=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=500

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y

# CRC-16/CCITT for the HC-12 telemetry frame check (hc12_rx.c).
CONFIG_CRC=y

# Runtime healthchecks and supervision
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_ASSERT=y

# Display (LVGL) tunables. CONFIG_DISPLAY / CONFIG_LVGL / CONFIG_ST7789V and the
# sensor/GNSS driver enables live in the board .conf; these size the LVGL draw
# buffer and heap for the 240x240 RGB565 panel.
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_Z_FLUSH_THREAD=y

# Extra Shells for Debugging
CONFIG_ADC_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_I2C_SHELL=y
