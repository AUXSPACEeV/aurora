#
# A single GPIO line that acts as the arm interlock for the state machine's
# "auxspace,rbf" chosen node. It exists so that a board can name such a line
# without borrowing a binding that implies something else: gpio-keys would
# hand the pin to the input subsystem, and gpio-leds would declare an input
# as an output.
#
# This binding has no driver. The consumer (lib/state/state_rbf.c) configures
# the pin as an input and debounces it itself.

title: Arm interlock input

description: >
  GPIO carrying the arm interlock.

compatible: "auxspaceev,arm-interlock"

include: [base.yaml]

properties:
  gpios:
    type: phandle-array
    required: true
    description: The interlock line. Exactly one GPIO.
